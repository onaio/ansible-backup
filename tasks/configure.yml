---
- name: Backup-configure | Reset the profile name
  ansible.builtin.set_fact:
    _backup_profile_name: "" # Initialize to a blank string

- name: Backup-configure | Ensure for backup user is exists
  ansible.builtin.user:
    name: "{{ backup_user }}"

- name: Backup-configure | Ensure for backup directories is exits
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: "0755"
  with_items:
    - "{{ backup_home }}"
    - "{{ backup_work }}"
    - "{{ backup_logdir }}"

- name: Backup-configure | Install duply
  ansible.builtin.template:
    src: duply.sh.j2
    dest: /usr/bin/duply
    owner: "{{ backup_user }}"
    group: "{{ backup_group }}"
    mode: "0755"

- name: Backup-configure | Setup cron
  ansible.builtin.template:
    src: cron.j2
    dest: /etc/cron.d/{{ backup_cron_filename }}
    owner: root
    group: root
    mode: "0644"
  when: backup_cron|bool

- name: Backup-configure | Configure logrotate
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/logrotate.d/backup
    owner: root
    group: root
    mode: "0644"

- name: Backup-configure | Configure backup profiles
  ansible.builtin.include_tasks: configure-profile.yml
  with_items: "{{ backup_profiles }}"
