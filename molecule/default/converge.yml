---
- name: Converge
  hosts: all
  become: true
  vars:
    backup_target: "file:///var/backup"
    backup_profiles:
      - name: etc
        source: /etc/hostname
  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      changed_when: false
  tasks:
    - name: Run the role
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
